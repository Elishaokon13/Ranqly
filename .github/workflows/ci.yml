# Mirrors Vercel: clean install + production build. Run on every PR so main stays green.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build (same as Vercel)
        run: npm run build
        env:
          # Optional env vars referenced at build time — add secrets in repo settings if needed
          NEXT_TELEMETRY_DISABLED: "1"
